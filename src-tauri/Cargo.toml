[package]
name = "hakoniwa-desktop-manager"
version = "0.1.0"
description = "Cross-platform Hakoniwa Core and asset manager"
authors = ["Hakoniwa Desktop Manager contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hakoniwa_desktop_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.4", features = [] }
tauri-plugin-dialog = "2.2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "v5", "serde"] }
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
